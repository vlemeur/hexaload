[project]
name = "hexaload"
version = "0.1.0"
description = "Honest benchmark of national French electricity load forecasting on RTE eco2mix open data (consolidated)"
readme = "README.md"
authors = [
    { name = "Vincent Le Meur", email = "vincent.lemeur@protonmail.com" }
]
requires-python = ">=3.14"
# Core only for now; statsforecast (Nixtlaverse) and TSFMs (Chronos, TimesFM,
# Moirai) are added in phase 4, after Python 3.14 compatibility is validated.
dependencies = [
    "pandas>=2.3",
    "pyarrow>=18.0.0",
    "pydantic>=2.14.3",
    "requests>=2.34.2",
    "tenacity>=9.2.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# Re-enabled as code and tests land:
# [tool.ty.src]
# include = ["hexaload", "tests"]
#
# [tool.pytest.ini_options]
# testpaths = ["tests"]
#
# [tool.coverage.run]
# source = ["src/hexaload"]
# # Network-only code, not covered by the offline suite — mock it before
# # measuring:
# omit = ["*/data/fetch.py"]
#
# [tool.coverage.report]
# show_missing = true

[dependency-groups]
dev = [
    "prek>=0.5.10",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "ty>=0.0.97",
]
