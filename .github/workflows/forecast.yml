name: forecast

# Daily D-1 forecast, published ~11:50 Paris time as a JSON push to main
# (docs/data/forecasts/<J>.json) — the /live/ section of the site fetches it
# client-side, so no site rebuild is needed. At 17:50 Paris the run re-forecasts
# tomorrow with a 17:00 freeze, once RTE's prevision_j1 is out (same information
# time as the reference).
#
# 11:50 Paris = 10:50 UTC in summer (CEST) and 11:50 UTC in winter (CET), so
# the cron fires twice and a local-time guard keeps only the right run.
"on":
  schedule:
    - cron: "50 10 * * *"  # 11:50 CEST (summer)
    - cron: "50 11 * * *"  # 11:50 CET  (winter)
    - cron: "50 15 * * *"  # 17:50 CEST re-run to pick up RTE's prevision_j1
    - cron: "50 16 * * *"  # 17:50 CET
  workflow_dispatch:
    inputs:
      max_429_wait:
        description: "Max seconds to sleep on a 429 before failing fast — raise it (e.g. 3600) for the manual cache-seeding run so it can wait out Open-Meteo's hourly limit"
        required: false
        default: "60"
        type: string

permissions:
  contents: write  # push the forecast JSON to main

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      # Restore BEFORE the forecast, save AFTER it (see the save step below):
      # a single actions/cache step saves the path at the end of its own step,
      # i.e. before the weights are downloaded — the cache would never fill.
      # Stable key (not keyed on uv.lock): the weights depend on the model
      # names in the code, not on the dependency lock.
      - name: Restore HF model weights
        uses: actions/cache/restore@v4
        id: hf-cache
        with:
          path: ~/.cache/huggingface
          key: hf-weights-${{ runner.os }}-v1
          restore-keys: hf-weights-${{ runner.os }}-
      - name: Guard — only run at 11:50 / 17:50 Paris time (manual runs always pass)
        id: guard
        run: |
          MODE=morning
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual run (workflow_dispatch) — time guard skipped, morning mode"
          else
            H=$(date -d "TZ=\"Europe/Paris\" now" +%H%M 2>/dev/null || TZ=Europe/Paris date +%H%M)
            echo "Paris time: $H"
            if [ "$H" -ge 1145 ] && [ "$H" -le 1200 ]; then
              MODE=morning
            elif [ "$H" -ge 1745 ] && [ "$H" -le 1800 ]; then
              MODE=evening
            else
              echo "outside the 11:50 / 17:50 Paris windows — skipping (idempotent)"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
      # The data cache (data/cache, ~80 MB) is persisted month over month: a
      # fresh runner restores the latest cache and only re-fetches the current
      # UTC month (always stale by design). Without this, every run re-downloads
      # 47 months of weather archive from GitHub's shared egress IPs, which
      # exhausts Open-Meteo's free hourly quota (429; the 429 wait is capped to
      # fail fast — see MAX_429_WAIT_S in src/hexaload/data/fetch.py).
      - name: Cache key — one data cache per UTC month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore data cache
        uses: actions/cache/restore@v4
        id: data-cache
        with:
          path: data/cache
          key: hexaload-data-${{ runner.os }}-${{ steps.month.outputs.month }}
          restore-keys: hexaload-data-${{ runner.os }}-
      # Refresh the data cache (incremental monthly cache; the current month
      # is always re-fetched), rebuild processed data + features. If the fetch
      # fails (e.g. Open-Meteo 429 from a shared CI egress IP), fall back to
      # the restored cache so the daily forecast still goes out.
      - name: Update data cache
        id: update
        if: steps.guard.outputs.skip != 'true'
        env:
          # daily crons fail fast on 429 (>60s); a manual seeding run can pass
          # a higher value via the max_429_wait input to wait out the limit
          HEXALOAD_MAX_429_WAIT_S: ${{ inputs.max_429_wait || '60' }}
        run: |
          if uv run --locked python scripts/fetch_data.py --source all; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.data-cache.outputs.cache-hit }}" = "true" ]; then
            echo "WARN: fetch failed but a data cache was restored — replaying it offline"
            uv run --locked python scripts/fetch_data.py --source all --offline
            echo "status=degraded" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: fetch failed and no data cache was restored — failing so the run can be retried"
            exit 1
          fi
      # Save the data cache AFTER the fetch (a single actions/cache step would
      # save the path before the fetch populates it). Same key as the restore;
      # the save is skipped when the key already exists (entries are immutable).
      # always(): an `if` without a status-check function gets an implicit
      # success(), so without always() the save would be SKIPPED when the fetch
      # step fails — we want the partial cache saved exactly then.
      - name: Save data cache
        if: ${{ always() && steps.guard.outputs.skip != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: hexaload-data-${{ runner.os }}-${{ steps.month.outputs.month }}
      - name: Rebuild features
        if: ${{ success() && steps.guard.outputs.skip != 'true' && steps.update.outputs.status }}
        run: uv run --locked python scripts/build_features.py
      # Morning run: publish the D-1 forecast with the 12:00 Paris freeze
      # (idempotent by date). Evening run (17:50): re-forecast tomorrow with
      # the 17:00 Paris freeze — by then RTE's prevision_j1 for J is published,
      # so our models get the same information time as the reference.
      - name: Forecast tomorrow (freeze J-1 12:00, refreshed 17:00 Paris)
        if: ${{ success() && steps.guard.outputs.skip != 'true' && steps.update.outputs.status }}
        run: |
          if [ "$MODE" = "evening" ]; then
            J=$(date -d "TZ=\"Europe/Paris\" tomorrow" +%F)
            echo "evening re-run: target $J, freeze 17:00 Paris"
            uv run --locked python scripts/forecast.py --force --date "$J" --freeze-hour 17
          else
            uv run --locked python scripts/forecast.py
          fi
        env:
          HF_HUB_OFFLINE: "0"
      # Save the HF cache AFTER the forecast downloaded the weights (same
      # restore-early/save-late split as the data cache).
      - name: Save HF model weights
        if: ${{ success() && steps.guard.outputs.skip != 'true' && steps.update.outputs.status }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: hf-weights-${{ runner.os }}-v1
      # Score the published forecasts vs actuals + CUSUM drift -> JSON push
      - name: Monitoring (daily scores + status)
        if: ${{ success() && steps.guard.outputs.skip != 'true' && steps.update.outputs.status }}
        run: uv run --locked python scripts/monitor.py
      - name: Push forecast JSON (skip if unchanged)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/forecasts/ docs/data/monitoring/ || true
          if git diff --cached --quiet; then
            echo "no new forecast JSON — nothing to push"
          else
            git commit -m "feat(forecast): daily D-1 forecast $(date +%F) [skip ci]"
            git push
          fi
